name: CI — Dubai BizNavigator Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-evals:
    name: Backend Lint, Tests & Langfuse Eval Gate
    runs-on: ubuntu-latest

    env:
      LANGSMITH_TRACING: "false"
      LANGSMITH_OTEL_ENABLED: "false"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Pytest Suite
        run: |
          pytest backend/tests/

      - name: Run Langfuse Dataset Evaluation Quality Gate
        run: |
          python backend/evals/run_langfuse_evals.py --dry-run --min-accuracy 0.90

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Frontend (Vite)
        working-directory: frontend
        run: |
          npm run build
